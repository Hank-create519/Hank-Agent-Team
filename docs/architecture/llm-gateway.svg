<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="lg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="lg-arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <style>
    .lg-title{font-size:30px;font-weight:700;fill:#e6edf3}
    .lg-sub{font-size:14px;fill:#8b949e}
    .provider{font-size:13px;font-weight:600;fill:#e6edf3}
    .proto{font-size:11px;fill:#8b949e;font-family:Consolas,monospace}
    .gwName{font-size:17px;font-weight:700;fill:#e6edf3}
    .gwDesc{font-size:12.5px;fill:#b6c2cf}
    .routeTag{font-size:11.5px;font-weight:700;font-family:Consolas,monospace}
    .agent{font-size:13px;font-weight:700}
  </style>

  <rect width="1240" height="700" rx="12" fill="#0d1117"/>
  <rect x="1" y="1" width="1238" height="698" rx="11" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="620" y="52" text-anchor="middle" class="lg-title">LLM 多协议接入层</text>
  <text x="620" y="78" text-anchor="middle" class="lg-sub">47 个预置模型 · 14 家厂商 · Agent 级独立配置 —— 四部门可以各自选用最适合的模型</text>

  <!-- ══════════ 左：Agent 层 ══════════ -->
  <g>
    <text x="185" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">四部门 Agent</text>
    <rect x="90" y="140" width="190" height="56" rx="9" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="185" y="174" text-anchor="middle" class="agent" fill="#e3b341">指挥部 command</text>
    <rect x="90" y="208" width="190" height="56" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="185" y="242" text-anchor="middle" class="agent" fill="#58a6ff">信息部 info</text>
    <rect x="90" y="276" width="190" height="56" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="185" y="310" text-anchor="middle" class="agent" fill="#3fb950">开发部 develop</text>
    <rect x="90" y="344" width="190" height="56" rx="9" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
    <text x="185" y="378" text-anchor="middle" class="agent" fill="#bc8cff">审核部 review</text>
    <text x="185" y="430" text-anchor="middle" class="gwDesc">每个 Agent 独立配置</text>
    <text x="185" y="450" text-anchor="middle" class="gwDesc">API Key + 模型选择</text>
    <text x="185" y="470" text-anchor="middle" class="gwDesc" fill="#8b949e">（如审核用强推理模型，</text>
    <text x="185" y="490" text-anchor="middle" class="gwDesc" fill="#8b949e">信息提取用轻量模型）</text>
  </g>

  <!-- arrows agents → gateway -->
  <line x1="280" y1="168" x2="425" y2="240" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#lg-arrow)"/>
  <line x1="280" y1="236" x2="425" y2="268" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#lg-arrow)"/>
  <line x1="280" y1="304" x2="425" y2="300" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#lg-arrow)"/>
  <line x1="280" y1="372" x2="425" y2="330" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#lg-arrow)"/>

  <!-- ══════════ 中：llm.ts 网关 ══════════ -->
  <rect x="430" y="180" width="330" height="232" rx="12" fill="#111a24" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="595" y="216" text-anchor="middle" class="gwName">llm.ts 协议路由网关</text>
  <text x="595" y="240" text-anchor="middle" class="gwDesc">多协议识别 · 请求适配 · 工具循环</text>

  <rect x="455" y="258" width="280" height="30" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="595" y="278" text-anchor="middle" class="routeTag" fill="#58a6ff">callAIWithTools · 工具循环 ≤ 15 轮</text>
  <rect x="455" y="296" width="280" height="30" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="595" y="316" text-anchor="middle" class="routeTag" fill="#8b949e">OpenAI 协议 → /v1/chat/completions</text>
  <rect x="455" y="334" width="280" height="30" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="595" y="354" text-anchor="middle" class="routeTag" fill="#8b949e">Anthropic 协议 → /v1/messages</text>
  <rect x="455" y="372" width="280" height="30" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="595" y="392" text-anchor="middle" class="routeTag" fill="#8b949e">Google 协议 → :generateContent</text>

  <!-- Mock fallback below gateway -->
  <path d="M 595 412 L 595 448" fill="none" stroke="#e3b341" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#lg-arrow2)"/>
  <rect x="470" y="452" width="250" height="54" rx="9" fill="#241c10" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="595" y="475" text-anchor="middle" font-size="13" font-weight="700" fill="#e3b341">Mock 降级模式</text>
  <text x="595" y="496" text-anchor="middle" class="gwDesc">无 API Key 也能跑通全流程验证</text>

  <!-- gateway → providers -->
  <line x1="760" y1="250" x2="880" y2="180" stroke="#8b949e" stroke-width="1.8" marker-end="url(#lg-arrow2)"/>
  <line x1="760" y1="280" x2="880" y2="280" stroke="#8b949e" stroke-width="1.8" marker-end="url(#lg-arrow2)"/>
  <line x1="760" y1="310" x2="880" y2="380" stroke="#8b949e" stroke-width="1.8" marker-end="url(#lg-arrow2)"/>
  <line x1="760" y1="340" x2="880" y2="480" stroke="#8b949e" stroke-width="1.8" marker-end="url(#lg-arrow2)"/>

  <!-- ══════════ 右：厂商矩阵 ══════════ -->
  <g>
    <rect x="885" y="120" width="290" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="910" y="150" class="provider">OpenAI · GPT 系列</text>
    <text x="910" y="172" class="proto">Bearer Token · /v1/chat/completions</text>
    <text x="910" y="196" class="provider">Anthropic · Claude 系列</text>
    <text x="910" y="218" class="proto">x-api-key · /v1/messages</text>

    <rect x="885" y="240" width="290" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="910" y="270" class="provider">Google · Gemini 系列</text>
    <text x="910" y="292" class="proto">API Key · :generateContent</text>
    <text x="910" y="316" class="provider">DeepSeek / Moonshot (月之暗面)</text>
    <text x="910" y="338" class="proto">OpenAI 兼容 · Bearer Token</text>

    <rect x="885" y="360" width="290" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="910" y="390" class="provider">通义千问 · 混元 · 豆包</text>
    <text x="910" y="412" class="proto">OpenAI 兼容 · dashscope/hunyuan</text>
    <text x="910" y="436" class="provider">GLM (智谱) · 零一万物 · MiniMax</text>
    <text x="910" y="458" class="proto">OpenAI 兼容 · bigmodel/lingyi</text>
    <text x="910" y="478" class="proto" fill="#3fb950">14 家厂商全覆盖</text>

    <rect x="885" y="490" width="290" height="56" rx="10" fill="#11161d" stroke="#30363d" stroke-dasharray="7,4"/>
    <text x="1030" y="514" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">47 个预置模型</text>
    <text x="1030" y="534" text-anchor="middle" class="proto">agentConfig.ts 注册表一键切换</text>
  </g>

  <!-- bottom stats -->
  <g>
    <rect x="90" y="560" width="320" height="100" rx="10" fill="#11161d" stroke="#30363d"/>
    <text x="250" y="600" text-anchor="middle" font-size="26" font-weight="700" fill="#58a6ff">47 / 14</text>
    <text x="250" y="630" text-anchor="middle" class="gwDesc">47 个预置模型，覆盖 14 家厂商</text>
    <rect x="460" y="560" width="320" height="100" rx="10" fill="#11161d" stroke="#30363d"/>
    <text x="620" y="600" text-anchor="middle" font-size="26" font-weight="700" fill="#3fb950">3 + N 协议</text>
    <text x="620" y="630" text-anchor="middle" class="gwDesc">原生三协议 + 任意 OpenAI 兼容端点</text>
    <rect x="830" y="560" width="320" height="100" rx="10" fill="#11161d" stroke="#30363d"/>
    <text x="990" y="600" text-anchor="middle" font-size="26" font-weight="700" fill="#e3b341">0 Key 可用</text>
    <text x="990" y="630" text-anchor="middle" class="gwDesc">Mock 降级，无 Key 不阻塞流程验证</text>
  </g>
</svg>
