name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: win/package-lock.json
      - run: npm ci
      - name: Lint（当前为报告性质，不阻塞）
        run: npm run lint
        continue-on-error: true
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
